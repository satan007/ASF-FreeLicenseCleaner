name: Release

# Push a tag like "0.0.5" (NO leading "v" - see README) to build the
# plugin and attach the ready-to-use output (drop straight into
# <ASF>/plugins/FreeLicenseCleaner/) to a new GitHub Release.
#
# The "v" prefix matters here: ArchiSteamFarm's IGitHubPluginUpdates does
# `new Version(releaseTag)` with no prefix handling, so a "v0.0.5" tag
# makes ASF's own auto-update check crash with
# "System.FormatException: The input string 'v0' was not in a correct
# format." ASF's own release tags (e.g. "6.3.9.6") never carry a "v",
# and neither should ours.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Bare release tag to create from scratch (no "v" prefix), e.g.
          "0.0.11". Use this path (instead of pushing/creating the tag
          by hand first) when GitHub's own API is flaking on releases
          that already exist for a tag - this creates the tag AND the
          release together, with nothing pre-existing to collide with.
        required: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: '10.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          show-progress: false
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build Release
        run: dotnet build FreeLicenseCleaner -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

      - name: Package plugin output
        # IMPORTANT: no wrapping "FreeLicenseCleaner/" folder inside the
        # zip - ASF's plugin auto-update extracts a release zip's raw
        # contents directly into the plugin's OWN folder (which is
        # already named/located correctly) and then moves those files
        # into place preserving whatever internal path the zip had. A
        # wrapping folder here used to duplicate the plugin's folder name
        # one level deeper on every single successful auto-update
        # (plugins/FreeLicenseCleaner/ -> .../FreeLicenseCleaner/FreeLicenseCleaner/
        # -> ever deeper), observed in production. The zip's files must
        # sit directly at its root.
        run: |
          set -eu
          out_dir="$(find FreeLicenseCleaner/bin/Release -maxdepth 1 -mindepth 1 -type d | head -n1)"
          mkdir -p dist
          cp -r "$out_dir"/. dist/
          cd dist
          zip -r ../FreeLicenseCleaner.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FreeLicenseCleaner.zip
          # generate_release_notes calls GitHub's own "generate release
          # notes content" REST endpoint, which was observed failing
          # with a hard 500/502 Server Error from GitHub itself on every
          # retry (unrelated to anything in this repo/workflow) - dropped
          # to stop that single call from taking the whole release down.
          generate_release_notes: false
          # On a manual (workflow_dispatch) run, create the tag+release
          # from scratch instead of deriving them from GITHUB_REF - lets
          # this run past a pre-existing release for the tag reliably
          # failing "fetch by tag" with a bare HttpError, observed
          # in production regardless of generate_release_notes.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
