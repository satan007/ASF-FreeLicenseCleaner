name: Release

# Push a tag like "v0.0.1" to build the plugin and attach the ready-to-use
# output (drop straight into <ASF>/plugins/FreeLicenseCleaner/) to a new
# GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: '10.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          show-progress: false
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build Release
        run: dotnet build FreeLicenseCleaner -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

      - name: Package plugin output
        run: |
          set -eu
          out_dir="$(find FreeLicenseCleaner/bin/Release -maxdepth 1 -mindepth 1 -type d | head -n1)"
          mkdir -p dist/FreeLicenseCleaner
          cp -r "$out_dir"/. dist/FreeLicenseCleaner/
          cd dist
          zip -r ../FreeLicenseCleaner.zip FreeLicenseCleaner

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FreeLicenseCleaner.zip
          generate_release_notes: true
